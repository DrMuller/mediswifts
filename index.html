<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Swift Migration Simulator</title>
  </head>
  <body>
    <div id="canvas-container"></div>

    <div id="title">
      <h1>Swift Migration</h1>
      <p>Annual migration patterns across Europe &amp; Africa</p>
    </div>

    <div id="legend"></div>

    <div id="bottom-panel">
      <div id="km-row"></div>
      <div id="controls-row">
        <button id="play-btn" aria-label="Pause">
          <svg id="icon-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
          <svg id="icon-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none"><polygon points="6,4 20,12 6,20"/></svg>
        </button>
        <span id="date-label">Jan 1</span>
        <div id="slider-wrap">
          <input type="range" id="timeline" min="0" max="1" step="0.0005" value="0" />
          <div id="months">
            <span>J</span><span>F</span><span>M</span><span>A</span><span>M</span><span>J</span>
            <span>J</span><span>A</span><span>S</span><span>O</span><span>N</span><span>D</span>
          </div>
        </div>
        <button id="speed-btn">1x</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
