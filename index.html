<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swift Migration Simulator</title>
  </head>
  <body>
    <div id="canvas-container"></div>

    <div id="title">
      <h1>Swift Migration</h1>
      <p>Annual migration patterns across Europe &amp; Africa</p>
    </div>

    <div id="legend"></div>

    <div id="bottom-panel">
      <div id="km-row"></div>
      <div id="controls-row">
        <button id="play-btn">&#x23F8;</button>
        <span id="date-label">Jan 1</span>
        <div id="slider-wrap">
          <input type="range" id="timeline" min="0" max="1" step="0.0005" value="0" />
          <div id="months">
            <span>J</span><span>F</span><span>M</span><span>A</span><span>M</span><span>J</span>
            <span>J</span><span>A</span><span>S</span><span>O</span><span>N</span><span>D</span>
          </div>
        </div>
        <button id="speed-btn">1x</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
